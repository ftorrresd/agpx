[package]
name = "agpx"
version = "0.1.3"
edition = "2021"
description = "Launch Claude Code against any provider in one command"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
